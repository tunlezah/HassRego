name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Government sites change without warning; a weekly run surfaces breakage.
    - cron: "0 20 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tooling
        run: python -m pip install --upgrade pip pytest ruff
      - name: Lint
        run: ruff check custom_components tests
      - name: Test
        run: python -m pytest tests/ -q
